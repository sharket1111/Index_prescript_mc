name: IndexPrescript
version: '${version}'
main: io.github.sharket1111.indexprescript.paper.IndexPrescriptPlugin
api-version: '${apiVersion}'
description: Rien's Caduceus and prescript terminal, inspired by Limbus Company.
authors: [sharket1111]
commands:
  indexprescript:
    description: Give Index Prescript items or resend the resource pack.
    usage: /indexprescript <give|laevatein|pack> ...
    aliases: [ip]
    permission: indexprescript.command
  md:
    description: Mirror Dungeon (alone or as a party).
    usage: /md [초대|수락|시작|나가기|기프트]
    aliases: [거울던전, mirror]
  menu:
    description: The Index Prescript menu (E.G.O loadout, resources, controls).
    usage: /menu
    aliases: [메뉴, ipmenu, 인덱스]
permissions:
  indexprescript.command:
    description: Use /indexprescript give.
    default: op
