# Index Prescript

resource-pack:
  # Send the Java resource pack (textures and 3D models) to Java players.
  # Bedrock players (Geyser/Floodgate) are skipped.
  enabled: true
  # External download URL of index_prescript_pack.zip. Leave empty to host the
  # bundled pack from this server with the built-in web server below.
  url: ""
  # SHA-1 of the pack at "url" (optional, lets clients cache it).
  sha1: ""
  # Built-in web server, used when "url" is empty. The port must be reachable
  # by players (open it in your host's firewall/panel).
  host-port: 8164
  # Address players use to reach this server, e.g. "play.example.com" or an IP.
  # Required for the built-in web server.
  host-address: ""
  # Kick players who decline the pack.
  required: false

bedrock-pack:
  # Copy the Bedrock pack (3D Caduceus/Laevatein, icons, voice lines) into
  # Geyser's packs folder and the custom item mappings into its
  # custom_mappings folder on startup, so Bedrock players see the items as
  # Java players do. Needs Geyser installed as a plugin on this server.
  install: true

# Body motions for the weapon skills (plugins/IndexPrescript/animations/skill_*.json, editable in the mod studio).
# While a skill plays, a player-shaped rig stands in for the wielder and moves its arms and legs.
skill-motions: true
