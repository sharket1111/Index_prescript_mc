# Prints paper-api signatures needed by the plugin. Used while developing; run manually.
name: paper-discover

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/paper-discover.yml

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: paper-api signatures
        run: |
          set +e
          v=26.3.build.231-stable
          base=https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/$v
          curl -fsS -o api.jar "$base/paper-api-$v.jar"
          ls -la api.jar
          unzip -l api.jar | grep -i -E 'Mannequin|ResolvableProfile|SpectatingEntity|SkinParts' | awk '{print $4}'
          for c in org.bukkit.entity.Mannequin org.bukkit.entity.Pose; do
            echo "=================== $c"
            javap -cp api.jar "$c"
          done
          echo "=================== Entity pose"
          javap -cp api.jar org.bukkit.entity.Entity | grep -i -E 'pose|rotation|setVisualFire'
          echo "=================== Display"
          javap -cp api.jar org.bukkit.entity.Display | grep -i -E 'transform|interpolat|teleportDuration|billboard'
          javap -cp api.jar org.bukkit.entity.ItemDisplay
