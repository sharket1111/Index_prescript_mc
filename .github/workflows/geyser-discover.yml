# Prints Geyser's custom item documentation and mapping reader source. Used while developing.
name: geyser-discover

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/geyser-discover.yml

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Wiki pages about custom items
        run: |
          set +e
          for repo in GeyserMC/GeyserWiki GeyserMC/geysermc.org; do
            for branch in master main; do
              tree=$(curl -fsS "https://api.github.com/repos/$repo/git/trees/$branch?recursive=1") || continue
              echo "### $repo@$branch"
              echo "$tree" | jq -r '.tree[].path' | grep -i -E 'custom-item|custom_item|attachable|item' | head -60
              for p in $(echo "$tree" | jq -r '.tree[].path' | grep -i -E 'custom-items.*\.mdx?$|custom_items.*\.mdx?$'); do
                echo "=================== $p"
                curl -fsS "https://raw.githubusercontent.com/$repo/$branch/$p"
              done
              break
            done
          done
      - name: Geyser v2 mapping reader source
        run: |
          set +e
          tree=$(curl -fsS "https://api.github.com/repos/GeyserMC/Geyser/git/trees/master?recursive=1")
          echo "$tree" | jq -r '.tree[].path' | grep -i -E 'mappings/versions|MappingsReader|CustomItemDefinition|ItemPredicate|PredicateReader|NonVanilla' | head -60
          for p in $(echo "$tree" | jq -r '.tree[].path' | grep -E 'item/custom/v2/mappings/.*\.java$|registry/mappings/versions/MappingsReader_v2\.java$|registry/mappings/versions/MappingsReader\.java$|MappingsConfigReader\.java$'); do
            echo "=================== $p"
            curl -fsS "https://raw.githubusercontent.com/GeyserMC/Geyser/master/$p"
          done
