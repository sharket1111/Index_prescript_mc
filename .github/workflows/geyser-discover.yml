# Prints Geyser's custom item mapping reader source. Used while developing.
name: geyser-discover

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/geyser-discover.yml

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: NodeReader
        run: |
          set +e
          curl -fsS "https://raw.githubusercontent.com/GeyserMC/Geyser/master/core/src/main/java/org/geysermc/geyser/registry/mappings/util/NodeReader.java" | sed '1,/^package /d' | grep -v -E '^import |^$' | head -150
          echo "=================== priority / sorting"
          tree=$(curl -fsS "https://api.github.com/repos/GeyserMC/Geyser/git/trees/master?recursive=1")
          for p in $(echo "$tree" | jq -r '.tree[].path' | grep -E 'GeyserCustomItemDefinition\.java$|CustomItemTranslator\.java$|PredicateStrategy\.java$'); do
            echo "--- $p"
            curl -fsS "https://raw.githubusercontent.com/GeyserMC/Geyser/master/$p" | grep -n -i -E 'priority|sort|compar|predicate' | head -40
          done
