# Prints Geyser's custom item documentation and mapping reader source. Used while developing.
name: geyser-discover

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/geyser-discover.yml

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Geyser v2 item mapping reader and predicates
        run: |
          set +e
          tree=$(curl -fsS "https://api.github.com/repos/GeyserMC/Geyser/git/trees/master?recursive=1")
          for p in $(echo "$tree" | jq -r '.tree[].path' | grep -E 'registry/mappings/versions/item/ItemMappingsReader_v2\.java$|registry/mappings/predicate/.*\.java$|registry/mappings/components/.*\.java$|registry/mappings/util/.*\.java$|api/item/custom/v2/CustomItemBedrockOptions\.java$'); do
            echo "=================== $p"
            # Strip the licence header and imports to keep the log short.
            curl -fsS "https://raw.githubusercontent.com/GeyserMC/Geyser/master/$p" | sed '1,/^package /d' | grep -v -E '^import |^$'
          done
